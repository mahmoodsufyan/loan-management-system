<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="900" height="620" rx="16" fill="#090D16"/>

  <!-- Tier 1: Client Channels -->
  <g filter="url(#glow)">
    <rect x="50" y="30" width="800" height="95" rx="12" fill="url(#cardBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="75" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#38BDF8">📱 1. Client &amp; Field Channels</text>
    <text x="75" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">Web Loan Intake Portal  •  Field Survey &amp; Geo-Tagging App  •  WhatsApp &amp; SMS Webhook Callbacks</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="450" y1="125" x2="450" y2="165" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Tier 2: Core Financial Engine -->
  <g filter="url(#glow)">
    <rect x="50" y="170" width="800" height="120" rx="12" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="2"/>
    <text x="75" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#F59E0B">⚙️ 2. Core Lending &amp; Financial Engine</text>
    <text x="75" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#F8FAFC">
      <tspan x="75" dy="0">📋 Loan Origination &amp; Feasibility  |  🛡️ Risk Scoring &amp; Collateral Valuation</tspan>
      <tspan x="75" dy="25">🔀 Multi-Tier Approval State Machine  |  📊 High-Precision Amortization &amp; Murabaha  |  💳 GL Journal Posting</tspan>
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="450" y1="290" x2="450" y2="330" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrowAmber)"/>

  <!-- Tier 3: Integration & Gateway Layer -->
  <g filter="url(#glow)">
    <rect x="50" y="335" width="800" height="110" rx="12" fill="url(#cardBg)" stroke="#10B981" stroke-width="2"/>
    <text x="75" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#10B981">🔌 3. Integration &amp; Gateway Layer</text>
    <text x="75" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#F8FAFC">
      <tspan x="75" dy="0">📱 Digital Wallet Gateway (Nano APIs)  |  🏦 Bank Feeds &amp; Automated Reconciliation</tspan>
      <tspan x="75" dy="25">📄 JasperReports Server (Instant PDF Engine)  |  📨 Multi-Channel SMS Providers</tspan>
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="450" y1="445" x2="450" y2="485" stroke="#10B981" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Tier 4: Database & Security -->
  <g filter="url(#glow)">
    <rect x="50" y="490" width="800" height="95" rx="12" fill="url(#cardBg)" stroke="#818CF8" stroke-width="2"/>
    <text x="75" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#818CF8">💾 4. Database &amp; Security Layer</text>
    <text x="75" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#CBD5E1">Oracle Database Enterprise Edition  •  Granular Dynamic RBAC (Page &amp; Button Level)  •  Immutable Audit Trails</text>
  </g>
</svg>
