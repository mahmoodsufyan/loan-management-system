<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="920" height="540" rx="16" fill="#090D16"/>

  <text x="460" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC">🔄 Credit Origination &amp; Servicing Lifecycle (State Machine)</text>

  <!-- Row 1: Intake to Committee -->
  <!-- Step 1 -->
  <g filter="url(#glow)">
    <rect x="40" y="75" width="180" height="65" rx="10" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="130" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">1. Application Intake</text>
    <text x="130" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Draft State)</text>
  </g>
  <line x1="220" y1="107" x2="265" y2="107" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <g filter="url(#glow)">
    <rect x="270" y="75" width="180" height="65" rx="10" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="360" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">2. Field Feasibility</text>
    <text x="360" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Appraisal &amp; Survey)</text>
  </g>
  <line x1="450" y1="107" x2="495" y2="107" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <g filter="url(#glow)">
    <rect x="500" y="75" width="180" height="65" rx="10" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="590" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">3. Credit Scoring</text>
    <text x="590" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(&amp; Blacklist Verification)</text>
  </g>
  <line x1="680" y1="107" x2="725" y2="107" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <g filter="url(#glow)">
    <rect x="730" y="75" width="160" height="65" rx="10" fill="url(#nodeBg)" stroke="#38BDF8" stroke-width="2"/>
    <text x="810" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">4. Collateral</text>
    <text x="810" y="123" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Mortgage Valuation)</text>
  </g>

  <!-- Arrow down from Step 4 to Decision -->
  <line x1="810" y1="140" x2="810" y2="195" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Decision Point -->
  <g filter="url(#glow)">
    <polygon points="810,205 900,250 810,295 720,250" fill="url(#nodeBg)" stroke="#F59E0B" stroke-width="2"/>
    <text x="810" y="247" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">Risk Criteria</text>
    <text x="810" y="263" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">Passed?</text>
  </g>

  <!-- Decision -> Rejected -->
  <line x1="720" y1="250" x2="575" y2="250" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="645" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#EF4444">No (Fail)</text>

  <g filter="url(#glow)">
    <rect x="410" y="220" width="160" height="60" rx="10" fill="url(#nodeBg)" stroke="#EF4444" stroke-width="2"/>
    <text x="490" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#EF4444">❌ Application Rejected</text>
  </g>

  <!-- Decision -> Approved (Step 5) -->
  <line x1="810" y1="295" x2="810" y2="350" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="840" y="325" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981">Yes (Pass)</text>

  <!-- Row 2: Committee to Settlement -->
  <!-- Step 5 -->
  <g filter="url(#glow)">
    <rect x="710" y="355" width="190" height="65" rx="10" fill="url(#nodeBg)" stroke="#10B981" stroke-width="2"/>
    <text x="805" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">5. Committee Approval</text>
    <text x="805" y="403" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Credit Sign-off)</text>
  </g>
  <line x1="710" y1="387" x2="665" y2="387" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Step 6 -->
  <g filter="url(#glow)">
    <rect x="470" y="355" width="190" height="65" rx="10" fill="url(#nodeBg)" stroke="#10B981" stroke-width="2"/>
    <text x="565" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">6. Disbursement</text>
    <text x="565" y="403" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(&amp; GL Journal Posting)</text>
  </g>
  <line x1="470" y1="387" x2="425" y2="387" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Step 7 -->
  <g filter="url(#glow)">
    <rect x="230" y="355" width="190" height="65" rx="10" fill="url(#nodeBg)" stroke="#10B981" stroke-width="2"/>
    <text x="325" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">7. Active Servicing</text>
    <text x="325" y="403" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Installments &amp; Collections)</text>
  </g>
  <line x1="230" y1="387" x2="185" y2="387" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Step 8 -->
  <g filter="url(#glow)">
    <rect x="20" y="355" width="160" height="65" rx="10" fill="url(#nodeBg)" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="382" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">8. Fully Settled</text>
    <text x="100" y="403" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">(Collateral Released)</text>
  </g>

  <!-- Bottom Badges -->
  <rect x="230" y="460" width="190" height="40" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="325" y="485" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F59E0B">🔄 Rescheduling Supported</text>

  <rect x="470" y="460" width="190" height="40" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="565" y="485" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#EF4444">⚖️ Legal Action for Default</text>
</svg>
